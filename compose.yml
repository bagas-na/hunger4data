services:
  api-gateway-service:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    image: api-gateway-service:latest
    container_name: api-gateway-service
    ports:
      - "${GATEWAY_REST_PORT}:${GATEWAY_REST_PORT}"
    environment:
      GRPC_ADDR_AUTH: authenticator-service:${AUTH_GRPC_PORT}
      GRPC_ADDR_NOTIFICATION: notification-service:${NOTIFICATION_GRPC_PORT}
      GRPC_ADDR_PAYMENT: payment-service:${PAYMENT_GRPC_PORT}
      GRPC_ADDR_SUBSCRIPTION: subscription-service:${SUBSCRIPTION_GRPC_PORT}
      RESTPort: ${GATEWAY_REST_PORT}
      JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped

  authenticator-service:
    build:
      context: .
      dockerfile: apps/authenticator/Dockerfile
    image: authenticator-service:latest
    container_name: authenticator-service
    ports:
      - "${AUTH_GRPC_PORT}:${AUTH_GRPC_PORT}"
    environment:
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: ${AUTH_GRPC_PORT}
      GRPC_ADDR_NOTIFICATION: notification-service:${NOTIFICATION_GRPC_PORT}
      JWT_DURATION: ${JWT_DURATION}
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
    image: notification-service:latest
    container_name: notification-service

    ports:
      - "${NOTIFICATION_GRPC_PORT}:${NOTIFICATION_GRPC_PORT}"

    environment:
      GRPC_PORT: ${NOTIFICATION_GRPC_PORT}
      DB_DSN: ${DB_DSN}
      MAILER_HOST: ${MAILER_HOST}
      MAILER_PORT: ${MAILER_PORT}
      MAILER_LOGIN: ${MAILER_LOGIN}
      MAILER_PASSWORD: ${MAILER_PASSWORD}
      MAILER_USERNAME: ${MAILER_USERNAME}
      MAILER_EMAIL: ${MAILER_EMAIL}

    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: apps/payment/Dockerfile
    image: payment-service:latest
    container_name: payment-service

    # Expose both transports for testing
    ports:
      - "${PAYMENT_GRPC_PORT}:${PAYMENT_GRPC_PORT}" # gRPC
      - "${PAYMENT_WEBHOOK_PORT}:${PAYMENT_WEBHOOK_PORT}" # Stripe webhook

    environment:
      DB_DSN: ${DB_DSN}

      GRPC_PORT: ${PAYMENT_GRPC_PORT}
      WEBHOOK_PORT: ${PAYMENT_WEBHOOK_PORT}
      GRPC_ADDR_NOTIFICATION: notification-service:${NOTIFICATION_GRPC_PORT}

      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}

    restart: unless-stopped

  subscription-service:
    build:
      context: .
      dockerfile: apps/subscription/Dockerfile
    image: subscription-service:latest
    container_name: subscription-service
    ports:
      - "${SUBSCRIPTION_GRPC_PORT}:${SUBSCRIPTION_GRPC_PORT}"
    environment:
      DB_DSN: ${DB_DSN}
      JWT_SECRET: ${JWT_SECRET}
      GRPC_PORT: ${SUBSCRIPTION_GRPC_PORT}
      # REST_PORT: ${SUBSCRIPTION_REST_PORT}
      REDIS_ADDR: redis:6379
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - 6379:6379
    volumes:
      - "./healthchecks:/healthchecks"
    healthcheck:
      test: /healthchecks/redis.sh
      interval: "5s"
