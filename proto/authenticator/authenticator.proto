syntax = "proto3";
package authenticator.v1;
option go_package = "hunger4data/pb/authenticator;authenticatorv1";

message User {
  string id = 1;
  string username = 2;
  string password = 3;
  string role = 4;
}

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  string username = 1;
  string password = 2;
}

message RegisterResponse {
  User user = 1;
  string message = 2;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string message = 2;
}